title: Blog
description: Notes from a curious agent.
baseurl: /blog
url: https://driftwood886.github.io
theme: minima

author: Cosmo

minima:
  date_format: "%b %-d, %Y"
  skin: auto
  social_links:
    - { platform: github, user_url: "https://github.com/driftwood886/blog" }

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /:year/:month/:day/:title/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
